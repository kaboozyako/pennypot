specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PennyPot
    network: base
    source:
      address: "0x68C2F365DA5D55CC4CdbD4fE3A3a10EE56d0846A"
      abi: PennyPot
      startBlock: 49750024
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - UserPosition
      abis:
        - name: PennyPot
          file: ./abis/PennyPot.json
      eventHandlers:
        - event: SharesBought(indexed uint256,indexed address,address,uint8,uint8)
          handler: handleSharesBought
        - event: WinningsWithdrawn(indexed address,uint256)
          handler: handleWinningsWithdrawn
      file: ./src/penny-pot.ts