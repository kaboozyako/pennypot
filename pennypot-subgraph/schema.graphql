type UserPosition @entity(immutable: false) {
  id: ID!
  totalTicketsBought: BigInt!
  totalShares: BigInt!
  totalClaimed: BigInt!
}
type TicketPurchase @entity(immutable: false) {
  id: ID! # Зробимо ID формату: АдресаГаманця-IDКвитка
  user: String!
  ticketId: BigInt!
  shares: Int!
  block: BigInt!
}